# PurpurPvP Messages Configuration (MiniMessage + YamlMessageAPI)
# Supports chat lines, action bars, titles/subtitles, and sound effects!

prefix: "<gradient:#9b59b6:#8e44ad>[PurpurPvP]</gradient> "

match:
  countdown:
    chat: "<yellow>Match starts in <gold><seconds></gold> seconds!"
    sound: "block.note_block.pling,1.0,1.5,player"
    title:
      title: "<gold><bold><seconds></bold></gold>"
      subtitle: "<gray>Get ready to fight!"
      fade-in: 0
      stay: 16
      fade-out: 4
  started:
    chat: "<green><bold>Round <round> - FIGHT!</bold></green>"
    sound: "entity.ender_dragon.growl,0.8,1.2,master"
    title:
      title: "<red><bold>FIGHT!</bold></red>"
      subtitle: "<gray>Round <round></gray>"
      fade-in: 0
      stay: 20
      fade-out: 10
  round-win:
    chat: "<gold>Round <round> won by <yellow><team></yellow>! <gray>(Score: <score>)</gray>"
    sound: "entity.experience_orb.pickup,1.0,1.2,player"
  match-win:
    chat: "<gold><bold>★ Match won by <yellow><team></yellow>! Final Score: <score></bold>"
    sound: "ui.toast.challenge_complete,1.0,1.0,master"
    title:
      title: "<gold><bold><team> WINS!</bold></gold>"
      subtitle: "<gray>Final Score: <score></gray>"
      fade-in: 0
      stay: 60
      fade-out: 20
  eliminated:
    chat: "<red><player> has been eliminated!"
    sound: "entity.player.death,1.0,1.0,player"
  draw:
    chat: "<yellow>Round <round> was a draw!"
  border-shrinking:
    actionbar: "<red><bold>⚠ World Border is closing!</bold></red>"
    sound: "block.beacon.ambient,1.0,0.5,master"
  shield-cooldown:
    actionbar: "<red>Shield on cooldown: <seconds>s"
  pearl-cooldown:
    actionbar: "<red>Pearl on cooldown: <seconds>s"
  trident-cooldown:
    actionbar: "<red>Trident on cooldown: <seconds>s"
  summary-header: "<dark_purple>═══════════════</dark_purple> <gold><bold>MATCH SUMMARY</bold></gold> <dark_purple>═══════════════</dark_purple>"
  summary-winner: "<green><bold>Winner:</bold></green> <yellow><player></yellow> <gray>(<health>❤)</gray>"
  summary-loser: "<red><bold>Loser:</bold></red> <gray><player></gray>"
  summary-kit: "<gray>Kit: <kit>"
  summary-duration: "<gray>Duration: <yellow><duration></yellow>"
  summary-inspect: "<click:run_command:'/purpurpvp inspect <match_id> <player>'><hover:show_text:'<yellow>Click to view <player>\\'s final inventory and health</yellow>'><aqua>[View <player>'s Inventory]</aqua></hover></click>"
  summary-rematch: "<click:run_command:'/duel <opponent>'><hover:show_text:'<green>Click to challenge <opponent> to a rematch!</green>'><gold><bold>[REMATCH]</bold></gold></hover></click>"
  summary-footer: "<dark_purple>═══════════════════════════════════════════</dark_purple>"

duel:
  request-sent: "<green>Duel request sent to <yellow><player></yellow> with kit <gold><kit></gold>."
  request-received:
    chat:
      - "<dark_purple>--------------------------------------------------</dark_purple>"
      - "<gold><bold><player></bold></gold> <yellow>has challenged you to a duel!</yellow>"
      - "<gray>Kit: <kit> | Arena: <arena></gray>"
      - "  <click:run_command:'/duel accept'><hover:show_text:'<green>Click to accept duel</green>'><green><bold>[ACCEPT]</bold></green></hover></click>   <click:run_command:'/duel decline'><hover:show_text:'<red>Click to decline duel</red>'><red><bold>[DECLINE]</bold></red></hover></click>"
      - "<dark_purple>--------------------------------------------------</dark_purple>"
    sound: "entity.experience_orb.pickup,1.0,1.5,player"
  request-expired: "<red>Duel request from <yellow><player></yellow> has expired."
  accepted: "<green>Duel accepted! Preparing match arena..."
  declined: "<red>Duel declined."
  already-in-match: "<red>You are already in a match!"
  target-in-match: "<red><player> is already in a match!"
  already-in-queue: "<red>You cannot duel while queued! Use /queue leave."
  cannot-duel-self: "<red>You cannot duel yourself!"

party:
  created: "<green>You created a party! Invite players with <yellow>/party invite <player></yellow>."
  disbanded: "<red>The party was disbanded."
  joined: "<green><player> joined the party!"
  left: "<yellow><player> left the party."
  kicked: "<red><player> was kicked from the party."
  kicked-target: "<red>You were kicked from the party."
  promoted: "<gold><player> is now the party leader!"
  invited: "<green>Invited <yellow><player></yellow> to the party."
  invite-received:
    chat:
      - "<dark_purple>--------------------------------------------------</dark_purple>"
      - "<gold><player></gold> <yellow>invited you to join their party!</yellow>"
      - "  <click:run_command:'/party accept <player>'><hover:show_text:'<green>Click to accept party invite</green>'><green><bold>[ACCEPT]</bold></green></hover></click>   <click:run_command:'/party decline <player>'><hover:show_text:'<red>Click to decline party invite</red>'><red><bold>[DECLINE]</bold></red></hover></click>"
      - "<dark_purple>--------------------------------------------------</dark_purple>"
    sound: "block.note_block.chime,1.0,1.2,player"
  invite-expired: "<red>Party invite from <yellow><player></yellow> expired."
  already-in-party: "<red>You are already in a party! Leave first with /party leave."
  target-already-in-party: "<red><player> is already in a party!"
  not-in-party: "<red>You are not in a party!"
  not-leader: "<red>Only the party leader can do that!"
  party-full: "<red>The party is full!"
  duel-sent: "<green>Party duel request sent to <yellow><target_leader>'s</yellow> party!"
  duel-received:
    chat:
      - "<dark_purple>--------------------------------------------------</dark_purple>"
      - "<gold><player>'s Party</gold> <yellow>has challenged your party to a duel!</yellow>"
      - "<gray>Kit: <kit></gray>"
      - "  <click:run_command:'/party duel accept'><hover:show_text:'<green>Click to accept party duel</green>'><green><bold>[ACCEPT]</bold></green></hover></click>   <click:run_command:'/party duel decline'><hover:show_text:'<red>Click to decline party duel</red>'><red><bold>[DECLINE]</bold></red></hover></click>"
      - "<dark_purple>--------------------------------------------------</dark_purple>"
  info-header: "<dark_purple>═══════════</dark_purple> <gold><bold>PARTY INFO</bold></gold> <dark_purple>═══════════</dark_purple>"
  info-leader: "<gray>Leader: <gold><leader></gold>"
  info-members: "<gray>Members (<count>): <yellow><members></yellow>"
  info-footer: "<dark_purple>════════════════════════════════</dark_purple>"

queue:
  joined:
    chat: "<green>You joined the <yellow><mode></yellow> queue. Searching for opponents..."
    sound: "block.note_block.bass,1.0,1.0,player"
  left:
    chat: "<red>You left the matchmaking queue."
    sound: "block.note_block.bass,1.0,0.5,player"
  searching: "<yellow>Searching for opponents... <gray>(Range: ±<range> Elo)</gray>"
  found:
    chat: "<green><bold>Match found! Teleporting to arena...</bold></green>"
    sound: "entity.player.levelup,1.0,1.5,player"
  no-arena: "<yellow>All arenas currently occupied. Standing by in queue..."
  invalid-mode: "<red>Invalid queue mode! Available: <modes>"
  already-in-queue: "<red>You are already in a queue! Use /queue leave first."
  party-queue-joined: "<green>Your party joined the <yellow><mode></yellow> queue!"

kit:
  saved: "<green>Kit <yellow><name></yellow> saved successfully!"
  deleted: "<red>Kit <yellow><name></yellow> deleted."
  not-found: "<red>Kit '<name>' not found."
  applied: "<green>Kit <yellow><name></yellow> applied!"
  created: "<green>Global kit <yellow><name></yellow> created from inventory!"
  anvil-title: "Enter Kit Name"
  anvil-placeholder: "Kit Name"

room:
  created: "<green>Custom room created! You are the host."
  joined: "<green><player> joined the room."
  left: "<yellow><player> left the room."
  full: "<red>This room is full!"
  closed: "<red>The room was closed."
  starting: "<green>Room starting! Allocating arena..."
  no-arena: "<red>No available arena could be allocated! Try again in a moment."
  kit-required: "<red>A kit must be selected before starting the room!"
  arena-in-use: "<red>The selected arena is currently in use!"

ranked:
  level-up:
    chat: "<gold><bold>★ LEVEL UP!</bold> You reached <yellow>Level <level></yellow>!"
    sound: "ui.toast.challenge_complete,1.0,1.2,master"
    title:
      title: "<gold><bold>LEVEL UP!</bold></gold>"
      subtitle: "<yellow>Level <old_level> → <new_level></yellow>"
      fade-in: 5
      stay: 50
      fade-out: 15
  xp-gained: "<green>+<xp> XP <gray>(Total: <total_xp>)</gray>"
  elo-change: "<gray>Elo: <old_elo> → <new_elo> (<sign><change>)</gray>"

lobby:
  inventory-saved: "<gray>Your inventory was saved while entering the arena."
  inventory-restored: "<green>Your inventory was restored."
  hotbar-queue: "<green><bold>Play / Matchmaking</bold></green>"
  hotbar-custom: "<aqua><bold>Custom Rooms</bold></aqua>"
  hotbar-kiteditor: "<yellow><bold>Kit Editor</bold></yellow>"
  hotbar-leaderboard: "<gold><bold>Leaderboard & Stats</bold></gold>"
  hotbar-party: "<light_purple><bold>Party Management</bold></light_purple>"

chat:
  lobby-format: "<gray>[Lobby] <gold>[Lv.<level>]</gold> <white><player></white>: <white><message></white>"
  match-format: "<aqua>[Match] <gold>[Lv.<level>]</gold> <white><player></white>: <white><message></white>"
  spectator-format: "<gray>[Spectator] <player>: <message></gray>"
  party-format: "<blue>[Party] <white><player></white>: <white><message></white>"

sign:
  no-permission: "<red>No permission to create PvP signs!</red>"
  created: "<green>PvP room sign created!</green>"
  line-1: "<dark_purple>[PurpurPvP]</dark_purple>"
  line-2: "<green>Click to Play!</green>"
  line-3: "<gold>Rooms: <rooms></gold>"
  line-4: "<aqua>Fighting: <players></aqua>"

scoreboard:
  title:
    lobby: "<light_purple><bold> PURPURPVP </bold></light_purple>"
    queue: "<gold><bold> QUEUE </bold></gold>"
    duel: "<red><bold> DUEL </bold></red>"
    ffa: "<gold><bold> FFA </bold></gold>"
    spectator: "<gray><bold> SPECTATE </bold></gray>"
  footer: "<dark_purple>purpurpvp.com</dark_purple>"
  lobby:
    online: "<gray>Online: <white><online></white></gray>"
    matches: "<gray>Matches: <white><matches></white></gray>"
    level: "<gray>Level: <green><level></green></gray>"
    elo: "<gray>Elo: <yellow><elo></yellow></gray>"
    kd: "<gray>K/D: <aqua><kills>/<deaths></aqua></gray>"
    wl: "<gray>W/L: <green><wins>/<losses></green></gray>"
  queue:
    searching: "<gray>Status: <yellow>Searching...</yellow></gray>"
  duel:
    round: "<gray>Round: <white><current>/<max></white></gray>"
    team-score: "<color><team>: <white><wins>/<max></white></color>"
    kills: "<gray>Your Kills: <white><kills></white></gray>"
    kit: "<gray>Kit: <gold><kit></gold></gray>"
    state: "<gray>State: <color><state></color></gray>"
  ffa:
    alive: "<gray>Alive: <green><alive></green></gray>"
    kills: "<gray>Your Kills: <white><kills></white></gray>"
    top-header: "<gold>Top Killers:</gold>"
    top-entry: " <gray><player>: <white><kills></white></gray>"
  spectator:
    spectating: "<gray>Spectating</gray>"
    round: "<gray>Round: <white><current>/<max></white></gray>"
    team-status: "<color><team>: <white><wins> wins</white></color>"

stats:
  header: "<dark_purple>--- <gold><username></gold> ---</dark_purple>"
  level: "  <gray>Level: <green><level></green> (<xp> XP)</gray>"
  elo: "  <gray>Elo: <yellow><elo></yellow></gray>"
  wl: "  <gray>W/L: <green><wins>/<losses></green></gray>"
  kd: "  <gray>K/D: <aqua><kills>/<deaths></aqua></gray>"

help:
  header: "<dark_purple>--- <gold>PurpurPvP Commands</gold> ---</dark_purple>"
  duel: "  <yellow>/duel <player> [kit]</yellow> <gray>- Challenge a player</gray>"
  queue: "  <yellow>/queue <mode></yellow> <gray>- Join matchmaking queue</gray>"
  party: "  <yellow>/party <subcommand></yellow> <gray>- Party management</gray>"
  stats: "  <yellow>/purpurpvp stats [player]</yellow> <gray>- View stats</gray>"
  leaderboard: "  <yellow>/purpurpvp leaderboard</yellow> <gray>- Open leaderboards</gray>"
  admin: "  <red>/purpurpvp reload | arena | kit | setlobby</red> <gray>- Admin controls</gray>"

admin:
  reload: "<green>Configuration, messages, arenas, and kits reloaded successfully!"
  setlobby: "<green>Lobby spawn location set to your current position!"
  arena-created: "<green>Arena '<name>' created successfully!"
  arena-deleted: "<red>Arena '<name>' deleted."
  spawn-set: "<green>Spawn point for Team <team> set in arena '<name>'!"
  spec-set: "<green>Spectator spawn point set in arena '<name>'!"
  arena-list-entry: "<gray>• <gold><name></gold> | Teams: <yellow><teams></yellow> | <color><status></color></gray>"
  kit-list-entry: "<gray>• <gold><name></gold></gray>"

error:
  no-permission: "<red>You don't have permission to do that."
  player-not-found: "<red>Player not found."
  invalid-args: "<red>Invalid arguments. Usage: <usage>"
  already-in-match: "<red>You cannot do that while in a match!"
