# PurpurPvP Configuration

database:
  type: H2  # H2 or MYSQL
  host: localhost
  port: 3306
  name: purpurpvp
  username: root
  password: ""

match:
  default-best-of: 1
  countdown-seconds: 5
  max-room-idle-seconds: 300

# ==============================================================================
#                      World & Arena Layout Architecture
# To ensure smooth gameplay and zero terrain loading screens when players teleport
# between Lobby, Duel matches, and FFA arenas, you can place them on the SAME world.
# ==============================================================================
world-settings:
  # Strategy:
  #   SAME_WORLD       - Lobby, Duels, and FFA share one world (instant teleports, no terrain loading screen).
  #   SEPARATE_WORLDS  - Lobby, Duels, and FFA each have their own dedicated world.
  strategy: SAME_WORLD

  # Shared world name (used when strategy is SAME_WORLD)
  shared-world: "world"

  lobby:
    world: "world"

  duels:
    world: "purpurpvp_duels"  # Used when SEPARATE_WORLDS
    origin-x: 10000
    origin-z: 10000
    grid-spacing: 300

  ffa:
    world: "purpurpvp_ffa"    # Used when SEPARATE_WORLDS
    origin-x: -10000
    origin-z: -10000

arena:
  world: "purpurpvp_arenas"
  grid-spacing: 300
  initial-pool-size: 5

xp:
  per-kill: 25
  per-round-win: 50
  per-match-win: 100
  per-match-complete: 30
  per-level: 500

elo:
  k-factor: 32

game-rules:
  allow-enderpearls: true
  allow-bows: true
  allow-block-breaking: false
  allow-shields: true
  allow-hunger: false
  natural-regen: false

# Lobby Hotbar Items (Parsed with YamlItem from ItemAPI)
lobby-items:
  enabled: true
  items:
    queue:
      slot: 0
      action: "QUEUE"
      item:
        material: DIAMOND_SWORD
        name: "<green><bold>Play / Matchmaking</bold></green>"
        lore:
          - "<gray>Click to join matchmaking queues</gray>"
    rooms:
      slot: 1
      action: "ROOMS"
      item:
        material: COMPASS
        name: "<aqua><bold>Custom Rooms</bold></aqua>"
        lore:
          - "<gray>Click to browse or create custom duel rooms</gray>"
    kiteditor:
      slot: 4
      action: "KITEDITOR"
      item:
        material: ANVIL
        name: "<yellow><bold>Kit Editor</bold></yellow>"
        lore:
          - "<gray>Click to create and preview custom kits</gray>"
    leaderboard:
      slot: 7
      action: "LEADERBOARD"
      item:
        material: NETHER_STAR
        name: "<gold><bold>Leaderboard & Stats</bold></gold>"
        lore:
          - "<gray>Click to view rankings and player stats</gray>"
    party:
      slot: 8
      action: "PARTY"
      item:
        material: BOOK
        name: "<light_purple><bold>Party Management</bold></light_purple>"
        lore:
          - "<gray>Click to manage your party</gray>"
